<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    min-height: 630px;
    background: #fafaf9;
    color: #16202b;
    font-family: "Bricolage Grotesque", sans-serif;
    padding: 78px 80px;
  }
  .mark { display: flex; align-items: center; gap: 16px; }
  .mark img { height: 54px; }
  .mark span { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  h1 {
    margin-top: 92px;
    font-size: 76px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.025em;
    max-width: 16ch;
  }
  .rot { color: #c0562c; }
  .decay {
    height: 11px;
    width: 620px;
    margin-top: 24px;
    background: repeating-linear-gradient(90deg, #c0562c 0 11px, transparent 11px 19px);
    -webkit-mask-image: linear-gradient(90deg, #000 0 34%, rgba(0,0,0,.8) 62%, rgba(0,0,0,.3) 85%, transparent 100%);
            mask-image: linear-gradient(90deg, #000 0 34%, rgba(0,0,0,.8) 62%, rgba(0,0,0,.3) 85%, transparent 100%);
  }
  .foot {
    margin-top: 70px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    line-height: 1.4;
    color: #5c636c;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="mark">
    <img src="logo.png" alt="">
    <span>claimrot</span>
  </div>
  <h1>The link still works.<br><span class="rot">The claim doesn&rsquo;t.</span></h1>
  <div class="decay"></div>
  <p class="foot">Re-checks the claims your docs cite against the pages they cite.</p>
</body>
</html>
